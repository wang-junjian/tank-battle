name: Deploy playable demo

# 本仓库是零构建的纯前端项目：可玩产物就是根目录的 tank-battle.html（单文件、自包含）。
# 本工作流在每次 push 到 main 时：跑单元测试 → 校验产物确实自包含 → 原样发布为 Pages 的 index.html。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，且不取消进行中的部署（避免站点短暂空档）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 无第三方依赖（package.json 没有 dependencies），不跑 npm ci。
      - run: npm test

      # 发布的是「单个 html 文件」，所以它必须真的是自包含的。
      # 一旦有人在 tank-battle.html 里加回外链样式/脚本/图片，发布后必然 404，
      # 这里提前拦下；纯数据 URI 的内联不受影响。
      - name: Guard standalone build is self-contained
        run: |
          set -euo pipefail
          f=tank-battle.html
          test -s "$f" || { echo "::error file=$f::$f 不存在或为空"; exit 1; }
          if grep -nE '<link[^>]*rel=["'"'"']?stylesheet|<script[^>]*[[:space:]]src=|<img[^>]*[[:space:]]src=["'"'"']?(https?:|/|\.)' "$f"; then
            echo "::error file=$f::单文件产物引用了外部资源，发布后会 404"
            exit 1
          fi
          grep -q '<canvas' "$f" || { echo "::error file=$f::缺少 <canvas>，产物不可玩"; exit 1; }
          echo "ok: $f 自包含，$(wc -c < "$f") 字节"

      - name: Assemble offline single-file site
        run: |
          mkdir -p site
          cp tank-battle.html site/index.html
          cp tank-battle.html site/tank-battle.html
          touch site/.nojekyll
          printf 'Playable build of commit %s\n' "$GITHUB_SHA" > site/build.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
